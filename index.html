<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>APT & UNIVERSAL EV CONTROLLER</title>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- LEAFLET -->
<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: #030712;
    color: #f8fafc;
    padding: 15px;
    text-align: center;
}

.app-container {
    background: #0f172a;
    padding: 20px;
    border-radius: 20px;
    margin: 10px auto;
    max-width: 380px;
    box-shadow: 0 0 25px rgba(0,240,255,.25);
    border: 2px solid #00ffff;
}

.logo-title {
    color:#00ffff;
    font-size:28px;
    font-weight:900;
    text-shadow:0 0 10px #00ffff;
}

.logo-sub {
    color:#94a3b8;
    font-size:11px;
    margin-bottom:20px;
}

button {
    background:transparent;
    color:#00f0ff;
    border:2px solid #00ffff;
    padding:14px;
    font-size:15px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    width:100%;
    margin-top:10px;
    transition:0.3s;
}

button:hover{
transform:scale(1.02);
box-shadow:0 0 15px rgba(0,255,255,.4);
}

.btn-save {
    color:#39ff14;
    border-color:#39ff14;
}

.btn-profile {
    color:#ff007f;
    border-color:#ff007f;
}

.btn-line {
    color:#06c755;
    border-color:#06c755;
}

.profile-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.control-panel,
.profile-panel {
    background:#020617;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
}

.flex-inputs {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label {
    display:block;
    margin-top:8px;
    margin-bottom:4px;
    color:#94a3b8;
    font-size:12px;
}

input,
select {
    width:90%;
    padding:10px;
    background:#0f172a;
    border:1px solid #334155;
    color:white;
    border-radius:8px;
}

#monitor-screen {
    color:#ff007f;
    font-family:monospace;
    background:#020617;
    padding:10px;
    border-radius:10px;
    border:1px solid #ff007f;
    margin-top:15px;
}

.gps-status {
    font-size:11px;
    color:#eab308;
    line-height:1.8;
}

.mapCard{
height:420px;
border-radius:25px;
overflow:hidden;
margin-top:30px;
border:1px solid rgba(0,255,255,.3);
box-shadow:0 0 25px rgba(0,255,255,.15);
}

#map{
width:100%;
height:100%;
}

.brand-panel {
    background:#1e1b4b;
    padding:12px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid #6366f1;
}

</style>
</head>
<body>

<div class="app-container">

<div class="logo-title">APT PRO-GPS</div>
<div class="logo-sub">Stable Plus Multi-Brand Edition</div>

<!-- ส่วนเลือกแบรนด์ -->
<div class="brand-panel">

<label style="color:#a5b4fc; margin-top:0;">
📡 CONTROLLER BRAND SELECTOR
</label>

<select id="controllerBrand" onchange="switchBrandSettings()">
    <option value="APT">🟢 APT安沛动力 (Original BLE)</option>
    <option value="APT_LOT">🟢 APT Smart Match</option>
    <option value="APT_96600">🟢 APT (Future Module)</option>
    <option value="VOTOL">🔵 VOTOL</option>
    <option value="EM">🔵 EM</option>
    <option value="FD">🟡 FarDriver</option>
    <option value="FARDRIVER">🟡 FARDRIVER</option>
    <option value="ND">Nanjing</option>
    <option value="Kelly">Kelly Controls</option>
    <option value="KLS">Kelly</option>
    <option value="Lingbo">Lingbo</option>
</select>

</div>

<div id="monitor-screen">STATUS: OFF LINE</div>

<button class="btn-connect" onclick="connectEV()">
⚡ CONNECT TO EV
</button>

<button onclick="disconnectEV()">
🔌 DISCONNECT
</button>

<div class="profile-panel">

<div id="gps-display" class="gps-status">
GPS READY...
</div>

<select id="profileChooser" onchange="loadSelectedProfile()">
    <option value="Race">🏁 Race</option>
    <option value="Street">🛵 Street</option>
    <option value="Cool">⚠️ Cool Down</option>
</select>

<div class="profile-grid">

    <button class="btn-profile" onclick="saveCurrentToProfile()">
    💾 SAVE PROFILE
    </button>

    <button class="btn-profile btn-line" onclick="shareToLine()">
    🟢 SHARE LINE
    </button>

    <button class="btn-profile" onclick="exportProfiles()">
    📦 EXPORT BACKUP
    </button>

</div>

</div>

<div class="control-panel">

<div class="flex-inputs">

<div>
<label>Phase Current</label>
<input type="number" id="phaseAmp" value="300">
</div>

<div>
<label>Battery Current</label>
<input type="number" id="batteryAmp" value="118">
</div>

</div>

<label id="fluxLabel">Flux Weakening</label>
<input type="number" id="fluxAmp" value="28">

<div class="flex-inputs">

<div>
<label>Throttle Low</label>
<input type="number" id="tLow" value="30">
</div>

<div>
<label>Throttle High</label>
<input type="number" id="tHigh" value="96">
</div>

</div>

</div>

<button class="btn-save" onclick="writeConfigToMotor()">
⚡ WRITE PARAMETERS TO MOTOR
</button>

<!-- MAP -->
<div class="mapCard">
    <div id="map"></div>
</div>

</div>

<script>

let writeChar = null;
let activeDevice = null;

const brandConfigs = {

    APT: {
        name: 'APT安沛动力',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    APT_LOT: {
        namePrefix: 'APT-',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    APT_96600: {
        name: 'APT',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    VOTOL: {
        name: 'VOTOL',
        serviceUuid: '0000ff00-0000-1000-8000-00805f9b34fb'
    },

    EM: {
        name: 'EM',
        serviceUuid: '0000ff00-0000-1000-8000-00805f9b34fb'
    },

    FD: {
        name: 'FarDriver',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    FARDRIVER: {
        name: 'FARDRIVER',
        serviceUuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    }
};

const defaultProfiles = {
    Race:{phase:300,battery:118,flux:29,low:30,high:96},
    Street:{phase:270,battery:110,flux:26,low:25,high:94},
    Cool:{phase:250,battery:90,flux:23,low:20,high:90}
};

function switchBrandSettings() {

    const brand = document.getElementById('controllerBrand').value;
    const monitor = document.getElementById('monitor-screen');

    monitor.innerText = `READY FOR ${brand}`;
    monitor.style.color = '#eab308';

    if (brand === 'VOTOL') {
        document.getElementById('fluxLabel').innerText = 'Flux Weakening (Votol Mode)';
    } else {
        document.getElementById('fluxLabel').innerText = 'Flux Weakening';
    }
}

async function connectEV(){

    const monitor = document.getElementById('monitor-screen');
    const selectedBrand = document.getElementById('controllerBrand').value;
    const config = brandConfigs[selectedBrand];

    try {

        monitor.innerText = 'STARTING BLUETOOTH SCAN...';

        let filterOptions = {};

        if (config.namePrefix) {

            filterOptions = {
                filters: [{ namePrefix: config.namePrefix }],
                optionalServices: [config.serviceUuid]
            };

        } else {

            filterOptions = {
                filters: [{ name: config.name }],
                optionalServices: [config.serviceUuid]
            };
        }

        const device = await navigator.bluetooth.requestDevice(filterOptions);

        activeDevice = device;

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(config.serviceUuid);
        const characteristics = await service.getCharacteristics();

        if (characteristics.length > 0) {
            writeChar = characteristics[0];
        }

        monitor.innerText = `CONNECTED TO: ${device.name}`;
        monitor.style.color = '#39ff14';

    } catch(error) {

        monitor.innerText = 'CONNECT FAILED';
        monitor.style.color = '#ff0055';

        console.error(error);
    }
}

async function writeConfigToMotor(){

    const monitor = document.getElementById('monitor-screen');

    if (!writeChar) {
        alert('กรุณา CONNECT ก่อน');
        return;
    }

    let phase = parseInt(document.getElementById('phaseAmp').value);
    let battery = parseInt(document.getElementById('batteryAmp').value);
    let flux = parseInt(document.getElementById('fluxAmp').value);
    let low = parseInt(document.getElementById('tLow').value);
    let high = parseInt(document.getElementById('tHigh').value);

    let hexCommand = new Uint8Array([
        0x3A, 0x01, 0x06, 0x00, 0x12,
        (phase >> 8) & 0xFF, phase & 0xFF,
        (battery >> 8) & 0xFF, battery & 0xFF,
        (flux >> 8) & 0xFF, flux & 0xFF,
        low & 0xFF,
        high & 0xFF,
        0x0D, 0x0A
    ]);

    try {

        monitor.innerText = 'WRITING CONFIG...';
        monitor.style.color = '#eab308';

        await writeChar.writeValue(hexCommand);

        monitor.innerText = 'SUCCESS: CONFIG OVERWRITTEN!';
        monitor.style.color = '#39ff14';

    } catch(error) {

        monitor.innerText = 'WRITE FAILED';
        monitor.style.color = '#ff0055';

        console.error(error);
    }
}

function disconnectEV(){

    const monitor = document.getElementById('monitor-screen');

    try {

        if (activeDevice && activeDevice.gatt.connected) {
            activeDevice.gatt.disconnect();
        }

        writeChar = null;

        monitor.innerText = 'STATUS: OFF LINE';
        monitor.style.color = '#ff007f';

    } catch(error) {
        console.error(error);
    }
}

function loadSelectedProfile(){

    let name = document.getElementById('profileChooser').value;

    let saved = JSON.parse(localStorage.getItem('APT_Profiles')) || defaultProfiles;

    let config = saved[name] || defaultProfiles[name];

    document.getElementById('phaseAmp').value = config.phase;
    document.getElementById('batteryAmp').value = config.battery;
    document.getElementById('fluxAmp').value = config.flux;
    document.getElementById('tLow').value = config.low;
    document.getElementById('tHigh').value = config.high;
}

function saveCurrentToProfile(){

    let name = document.getElementById('profileChooser').value;

    let saved = JSON.parse(localStorage.getItem('APT_Profiles')) || defaultProfiles;

       saved[name] = {
        phase: parseInt(document.getElementById('phaseAmp').value),
        battery: parseInt(document.getElementById('batteryAmp').value),
        flux: parseInt(document.getElementById('fluxAmp').value),
        low: parseInt(document.getElementById('tLow').value),
        high: parseInt(document.getElementById('tHigh').value)
    };

    localStorage.setItem(
        'APT_Profiles',
        JSON.stringify(saved)
    );

    alert('SAVE SUCCESS');
}

/* ======================================
   EXPORT PROFILE
====================================== */

function exportProfiles(){

    const profiles = localStorage.getItem('APT_Profiles');

    if (!profiles) {

        alert('ไม่มีข้อมูล');
        return;
    }

    const blob = new Blob(
        [profiles],
        {type:'application/json'}
    );

    const link = document.createElement('a');

    link.href = URL.createObjectURL(blob);
    link.download = 'APT_Backup_Profiles.json';

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

/* ======================================
   SHARE TO LINE
====================================== */

function shareToLine(){

    let textMessage =
`🌐 EV TUNER PROFILE ⚡
🏎️🪫PHASE: ${document.getElementById('phaseAmp').value}A
🔋⚡BATTERY: ${document.getElementById('batteryAmp').value}A
🛵FLUX: ${document.getElementById('fluxAmp').value}A
📍LAT: ${document.getElementById('gps-display').value}A
📍 LNG: ${document.getElementById('gps-display').value}A
🚀 SPEED: ${document.getElementById.value}A`;    
//📍🔌LAT: ${lat.toFixed(6)}<br>
//📍 LNG: ${lng.toFixed(6)}<br>
//🚀 SPEED: ${speed} km/h    

    let lineUrl =
`https://line.me/R/msg/text/?${encodeURIComponent(textMessage)}`;

    window.open(lineUrl, '_blank');
}

/* ======================================
   REAL GPS MAP SYSTEM
====================================== */

let map;
let marker;
let routeLine;
let gpsInitialized = false;

function initMap(lat = 7.8804521, lng = 98.3923468){

    map = L.map('map').setView([lat, lng], 17);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 20,
            attribution: 'APT PRO GPS'
        }
    ).addTo(map);

    marker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup('📍 CURRENT LOCATION')
        .openPopup();

    routeLine = L.polyline([], {
        weight: 5,
        opacity: 0.8
    }).addTo(map);

    gpsInitialized = true;
}

function startRealGPS(){

    const gpsDisplay =
    document.getElementById('gps-display');

    if(!navigator.geolocation){

        gpsDisplay.innerHTML =
        '❌ GPS NOT SUPPORTED';

        return;
    }

    navigator.geolocation.watchPosition(

        (position)=>{

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            const speed =
            position.coords.speed
            ? (position.coords.speed * 3.6).toFixed(1)
            : 0;

            if(!gpsInitialized){

                initMap(lat, lng);
            }

            marker.setLatLng([lat, lng]);

            map.flyTo([lat, lng], 18, {
                animate: true,
                duration: 1
            });

            routeLine.addLatLng([lat, lng]);

            gpsDisplay.innerHTML = `
            📍 LAT: ${lat.toFixed(6)}<br>
            📍 LNG: ${lng.toFixed(6)}<br>
            🚀 SPEED: ${speed} km/h
            `;

        },

        (error)=>{

            console.error(error);

            gpsDisplay.innerHTML =
            '❌ GPS ACCESS DENIED';
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

window.onload = function(){

    loadSelectedProfile();
    startRealGPS();

    console.log('APT PRO GPS SYSTEM READY');
};

</script>
</body>
</html>
