<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APT & UNIVERSAL EV CONTROLLER</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #030712;
    color: #f8fafc;
    padding: 15px;
    text-align: center;
}

.app-container {
    background: #0f172a;
    padding: 20px;
    border-radius: 20px;
    margin: 10px auto;
    max-width: 380px;
    box-shadow: 0 0 25px rgba(0,240,255,.25);
    border: 2px solid #00f0ff;
}

.logo-title {
    color:#00f0ff;
    font-size:28px;
    font-weight:900;
    text-shadow:0 0 10px #00f0ff;
}

.logo-sub {
    color:#94a3b8;
    font-size:11px;
    margin-bottom:20px;
}

button {
    background:transparent;
    color:#00f0ff;
    border:2px solid #00f0ff;
    padding:14px;
    font-size:15px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    width:100%;
    margin-top:10px;
}

.btn-save {
    color:#39ff14;
    border-color:#39ff14;
}

.btn-profile {
    color:#ff007f;
    border-color:#ff007f;
}

.btn-line {
    color:#06c755;
    border-color:#06c755;
}

.profile-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.control-panel,
.profile-panel {
    background:#020617;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
}

.flex-inputs {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label {
    display:block;
    margin-top:8px;
    margin-bottom:4px;
    color:#94a3b8;
    font-size:12px;
}

input,
select {
    width:90%;
    padding:10px;
    background:#0f172a;
    border:1px solid #334155;
    color:white;
    border-radius:8px;
}

#monitor-screen {
    color:#ff007f;
    font-family:monospace;
    background:#020617;
    padding:10px;
    border-radius:10px;
    border:1px solid #ff007f;
}

.gps-status {
    font-size:11px;
    color:#eab308;
}

.brand-panel {
    background:#1e1b4b;
    padding:12px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid #6366f1;
}
</style>
</head>
<body>

<div class="app-container">

<div class="logo-title">APT PRO-GPS</div>
<div class="logo-sub">Stable Plus Multi-Brand Edition</div>

<!-- ส่วนเลือกแบรนด์ Controller -->
<div class="brand-panel">

<label style="color:#a5b4fc; margin-top:0;">
📡 CONTROLLER BRAND SELECTOR
</label>

<select id="controllerBrand" onchange="switchBrandSettings()">
    <option value="APT">🟢 APT安沛动力 (Original BLE)</option>
    <option value="APT_LOT">🟢 APT Smart Match (ล็อตปี 22 - 26 / APT-YYWW)</option>
    <option value="APT_96600">🟢 APT (Future Module)</option>
    <option value="VOTOL">🔵 VOTOL (Future Module)</option>
    <option value="EM">🔵 EM (Future Module)</option>
    <option value="FD">🟡 FarDriver (Future Module)</option>
    <option value="FARDRIVER">🟡 FARDRIVER (Future Module)</option>
    <option value="ND">Nanjing (Future Module)</option>
    <option value="Kelly">Kelly Controls (Future Module)</option>
    <option value="KLS">Kelly (Future Module)</option>
    <option value="Lingbo">Lingbo (Future Module)</option>
</select>

</div>

<div id="monitor-screen">STATUS: OFF LINE</div>

<button class="btn-connect" onclick="connectEV()">
⚡ CONNECT TO EV
</button>

<button onclick="disconnectEV()">
🔌 DISCONNECT
</button>

<div class="profile-panel">

<div id="gps-display" class="gps-status">
GPS READY...
</div>

<select id="profileChooser" onchange="loadSelectedProfile()">
    <option value="Race">🏁 Race</option>
    <option value="Street">🛵 Street</option>
    <option value="Cool">⚠️ Cool Down</option>
</select>

<div class="profile-grid">
    <button class="btn-profile" onclick="saveCurrentToProfile()">
    💾 SAVE PROFILE
    </button>

    <button class="btn-profile btn-line" onclick="shareToLine()">
    🟢 SHARE LINE
    </button>

    <button class="btn-profile" onclick="exportProfiles()">
    📦 EXPORT BACKUP
    </button>
</div>

</div>

<div class="control-panel">

<div class="flex-inputs">

<div>
<label>Phase Current</label>
<input type="number" id="phaseAmp" value="285">
</div>

<div>
<label>Battery Current</label>
<input type="number" id="batteryAmp" value="118">
</div>

</div>

<label id="fluxLabel">Flux Weakening</label>
<input type="number" id="fluxAmp" value="35">

<div class="flex-inputs">

<div>
<label>Throttle Low</label>
<input type="number" id="tLow" value="25">
</div>

<div>
<label>Throttle High</label>
<input type="number" id="tHigh" value="96">
</div>

</div>

</div>

<button class="btn-save" onclick="writeConfigToMotor()">
⚡ WRITE PARAMETERS TO MOTOR
</button>

</div>

<script>
let writeChar = null;
let activeDevice = null;

const brandConfigs = {

    APT: {
        name: 'APT安沛动力',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    APT_LOT: {
        namePrefix: 'APT-',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    APT_96600: {
        name: 'APT',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    VOTOL: {
        name: 'VOTOL',
        serviceUuid: '0000ff00-0000-1000-8000-00805f9b34fb'
    },

    EM: {
        name: 'EM',
        serviceUuid: '0000ff00-0000-1000-8000-00805f9b34fb'
    },

    FD: {
        name: 'FarDriver',
        serviceUuid: '0000ffe0-0000-1000-8000-00805f9b34fb'
    },

    FARDRIVER: {
        name: 'FARDRIVER',
        serviceUuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    },

    ND: {
        name: 'Nanjing',
        serviceUuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    },

    Kelly: {
        name: 'Kelly Controls',
        serviceUuid: '49535343-fe7d-4ae5-8fa9-9fafd205e455'
    },

    KLS: {
        name: 'Kelly',
        serviceUuid: '49535343-fe7d-4ae5-8fa9-9fafd205e455'
    },

    Lingbo: {
        name: 'Lingbo',
        serviceUuid: '0000ffe1-0000-1000-8000-00805f9b34fb'
    }
};

const defaultProfiles = {
    Race:{phase:285,battery:118,flux:34,low:25,high:96},
    Street:{phase:270,battery:110,flux:32,low:23,high:94},
    Cool:{phase:200,battery:85,flux:28,low:20,high:87}
};

function switchBrandSettings() {

    const brand = document.getElementById('controllerBrand').value;
    const monitor = document.getElementById('monitor-screen');

    monitor.innerText = `READY FOR ${brand}`;
    monitor.style.color = '#eab308';

    if (brand === 'VOTOL') {
        document.getElementById('fluxLabel').innerText = 'Flux Weakening (Votol Mode)';
    } else {
        document.getElementById('fluxLabel').innerText = 'Flux Weakening';
    }
}

async function connectEV(){

    const monitor = document.getElementById('monitor-screen');
    const selectedBrand = document.getElementById('controllerBrand').value;
    const config = brandConfigs[selectedBrand];

    try {

        monitor.innerText = 'STARTING BLUETOOTH SCAN...';

        let filterOptions = {};

        if (config.namePrefix) {

            filterOptions = {
                filters: [{ namePrefix: config.namePrefix }],
                optionalServices: [config.serviceUuid]
            };

        } else {

            filterOptions = {
                filters: [{ name: config.name }],
                optionalServices: [config.serviceUuid]
            };
        }

        const device = await navigator.bluetooth.requestDevice(filterOptions);

        activeDevice = device;

        let connectedName = device.name || 'Unknown Device';

        let batchInfo = '';

        if (connectedName.startsWith('APT-')) {

            let numPart = connectedName.replace('APT-', '');

            if (numPart.length >= 4) {
                let year = '20' + numPart.substring(0, 2);
                let week = numPart.substring(2, 4);

                batchInfo = ` (ปีผลิต: ${year} / Week: ${week})`;
            }
        }

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(config.serviceUuid);
        const characteristics = await service.getCharacteristics();

        if (characteristics.length > 0) {
            writeChar = characteristics[0];
        }

        monitor.innerText = `CONNECTED TO: ${connectedName}${batchInfo}`;
        monitor.style.color = '#39ff14';

    } catch(error) {

        monitor.innerText = 'CONNECT FAILED';
        monitor.style.color = '#ff0055';

        console.error(error);
    }
}

async function writeConfigToMotor(){

    const monitor = document.getElementById('monitor-screen');
    const selectedBrand = document.getElementById('controllerBrand').value;

    if (!writeChar) {
        alert('กรุณา CONNECT ก่อน');
        return;
    }

    let phase = parseInt(document.getElementById('phaseAmp').value);
    let battery = parseInt(document.getElementById('batteryAmp').value);
    let flux = parseInt(document.getElementById('fluxAmp').value);
    let low = parseInt(document.getElementById('tLow').value);
    let high = parseInt(document.getElementById('tHigh').value);

    let hexCommand;

    if (selectedBrand === 'APT') {

        hexCommand = new Uint8Array([
            0x3A, 0x01, 0x06, 0x00, 0x12,
            (phase >> 8) & 0xFF, phase & 0xFF,
            (battery >> 8) & 0xFF, battery & 0xFF,
            (flux >> 8) & 0xFF, flux & 0xFF,
            low & 0xFF,
            high & 0xFF,
            0x0D, 0x0A
        ]);

    } else if (selectedBrand === 'APT_96600') {

        let tempArray = [
            0x3A, 0x01, 0x06,
            (phase >> 8) & 0xFF, phase & 0xFF,
            (battery >> 8) & 0xFF, battery & 0xFF,
            (flux >> 8) & 0xFF, flux & 0xFF
        ];

        let checksum = 0;

        for (let i = 0; i < tempArray.length; i++) {
            checksum ^= tempArray[i];
        }

        tempArray.push(checksum);

        hexCommand = new Uint8Array(tempArray);

    } else if (selectedBrand === 'VOTOL') {

        alert('ระบบคำสั่งของ VOTOL กำลังอยู่ในช่วงพัฒนา');
        return;

    } else if (selectedBrand === 'FARDRIVER' || selectedBrand === 'FD') {

        alert('ระบบคำสั่งของ FARDRIVER กำลังอยู่ในช่วงพัฒนา');
        return;

    } else {

        alert('ยังไม่รองรับ Controller รุ่นนี้');
        return;
    }

    try {

        monitor.innerText = 'WRITING CONFIG...';
        monitor.style.color = '#eab308';

        await writeChar.writeValue(hexCommand);

        monitor.innerText = 'SUCCESS: CONFIG OVERWRITTEN!';
        monitor.style.color = '#39ff14';

    } catch(error) {

        try {

            await writeChar.writeValueWithoutResponse(hexCommand);

            monitor.innerText = 'SUCCESS: LOW LATENCY MODE';
            monitor.style.color = '#39ff14';

        } catch(err) {

            monitor.innerText = 'WRITE FAILED';
            monitor.style.color = '#ff0055';

            console.error(err);
        }
    }
}

function disconnectEV(){

    const monitor = document.getElementById('monitor-screen');

    try {

        if (activeDevice && activeDevice.gatt.connected) {
            activeDevice.gatt.disconnect();
        }

        writeChar = null;

        monitor.innerText = 'STATUS: OFF LINE';
        monitor.style.color = '#ff007f';

    } catch(error) {
        console.error(error);
    }
}

function loadSelectedProfile(){

    let name = document.getElementById('profileChooser').value;

    let saved = JSON.parse(localStorage.getItem('APT_Profiles')) || defaultProfiles;

    let config = saved[name] || defaultProfiles[name];

    document.getElementById('phaseAmp').value = config.phase;
    document.getElementById('batteryAmp').value = config.battery;
    document.getElementById('fluxAmp').value = config.flux;
    document.getElementById('tLow').value = config.low;
    document.getElementById('tHigh').value = config.high;
}

function saveCurrentToProfile(){

    let name = document.getElementById('profileChooser').value;

    let saved = JSON.parse(localStorage.getItem('APT_Profiles')) || defaultProfiles;

    saved[name] = {
        phase: parseInt(document.getElementById('phaseAmp').value),
        battery: parseInt(document.getElementById('batteryAmp').value),
        flux: parseInt(document.getElementById('fluxAmp').value),
        low: parseInt(document.getElementById('tLow').value),
        high: parseInt(document.getElementById('tHigh').value)
    };

    localStorage.setItem('APT_Profiles', JSON.stringify(saved));

    alert('SAVE SUCCESS');
}

function exportProfiles(){

    const profiles = localStorage.getItem('APT_Profiles');

    if (!profiles) {
        alert('ไม่มีข้อมูล');
        return;
    }

    const blob = new Blob([profiles], {type:'application/json'});

    const link = document.createElement('a');

    link.href = URL.createObjectURL(blob);
    link.download = 'APT_Backup_Profiles.json';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function shareToLine(){

    let textMessage =
`⚡ EV TUNER PROFILE ⚡
PHASE: ${document.getElementById('phaseAmp').value}A
BATTERY: ${document.getElementById('batteryAmp').value}A
FLUX: ${document.getElementById('fluxAmp').value}A`;

    let lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(textMessage)}`;

    window.open(lineUrl, '_blank');
}

window.onload = function(){
    loadSelectedProfile();
};

</script>
</body>
</html>
